<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>업무 트래커 & D-Day 카운터</title>
  <style>
    /* 하얀색과 하늘색이 부드럽게 움직이는 파스텔 톤 애니메이션 배경 */
    body {
      margin: 0;
      padding: 20px;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(-45deg, #e0f2fe, #ffffff, #bae6fd, #f0f9ff);
      background-size: 400% 400%;
      animation: gradientBG 12s ease infinite;
      min-height: 100vh;
      color: #334155;
    }

    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    .card {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(10px);
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.6);
    }

    h1, h2 {
      margin-top: 0;
      color: #0369a1;
    }

    /* D-Day 대시보드 */
    .dday-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 12px;
      margin-top: 15px;
    }

    .dday-item {
      background: #f0f9ff;
      border: 1px solid #bae6fd;
      padding: 15px;
      border-radius: 12px;
      text-align: center;
    }

    .dday-item .number {
      font-size: 24px;
      font-weight: bold;
      color: #0284c7;
      margin-top: 5px;
    }

    /* 진행도 바 */
    .progress-container {
      margin: 20px 0;
    }

    .progress-bar-bg {
      background-color: #e2e8f0;
      border-radius: 10px;
      height: 20px;
      overflow: hidden;
    }

    .progress-bar-fill {
      background: linear-gradient(90deg, #38bdf8, #0284c7);
      height: 100%;
      width: 0%;
      transition: width 0.4s ease;
    }

    /* 상태 카운터 */
    .status-counts {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }

    .status-badge {
      flex: 1;
      min-width: 100px;
      text-align: center;
      padding: 10px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 14px;
    }

    .status-scheduled { background-color: #f1f5f9; color: #475569; }
    .status-in-progress { background-color: #e0f2fe; color: #0369a1; }
    .status-review { background-color: #fef3c7; color: #b45309; }
    .status-completed { background-color: #dcfce7; color: #15803d; }

    /* 입력을 위한 폼 */
    .input-group {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    input[type="text"] {
      flex: 1;
      padding: 12px 16px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 15px;
      outline: none;
    }

    input[type="text"]:focus {
      border-color: #38bdf8;
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
    }

    button.add-btn {
      padding: 12px 20px;
      background-color: #0284c7;
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }

    button.add-btn:hover { background-color: #0369a1; }

    /* 업무 목록 및 드래그 스타일 */
    .task-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .task-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: white;
      padding: 14px 18px;
      border-radius: 10px;
      margin-bottom: 10px;
      border: 1px solid #e2e8f0;
      gap: 10px;
      cursor: grab;
      transition: background 0.2s, transform 0.1s, box-shadow 0.2s;
      user-select: none;
    }

    .task-item:active {
      cursor: grabbing;
    }

    .task-item.dragging {
      opacity: 0.5;
      background: #e0f2fe;
      border: 2px dashed #0284c7;
    }

    .drag-handle {
      color: #94a3b8;
      font-weight: bold;
      margin-right: 6px;
      cursor: grab;
    }

    .task-title {
      flex: 1;
      font-size: 15px;
      word-break: break-all;
    }

    .btn-toggle {
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      font-weight: bold;
      transition: transform 0.1s;
    }

    .btn-toggle:active { transform: scale(0.95); }

    /* 우선순위 클릭 스타일 */
    .priority-high { background-color: #fee2e2; color: #b91c1c; }
    .priority-medium { background-color: #ffedd5; color: #c2410c; }
    .priority-low { background-color: #f1f5f9; color: #64748b; }

    .btn-delete {
      background: transparent;
      border: none;
      color: #94a3b8;
      cursor: pointer;
      font-size: 16px;
    }
    .btn-delete:hover { color: #ef4444; }
  </style>
</head>
<body>

<div class="container">
  <!-- 1. D-Day 카운터 (11월 20일 기준) -->
  <div class="card">
    <h2>📅 11월 20일까지 남은 기간</h2>
    <div class="dday-grid">
      <div class="dday-item">
        <div>총 남은 일수</div>
        <div class="number" id="days-total">-일</div>
      </div>
      <div class="dday-item">
        <div>평일 (근무일)</div>
        <div class="number" id="days-work">-일</div>
      </div>
      <div class="dday-item">
        <div>주말 & 공휴일</div>
        <div class="number" id="days-off">-일</div>
      </div>
    </div>
  </div>

  <!-- 2. 진행도 및 상태 요약 -->
  <div class="card">
    <h2>📊 업무 진행 현황</h2>
    <div class="progress-container">
      <div style="display: flex; justify-content: space-between; margin-bottom: 6px;">
        <span>전체 진행도</span>
        <span id="progress-percent" style="font-weight: bold; color: #0284c7;">0%</span>
      </div>
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="progress-fill"></div>
      </div>
    </div>

    <div class="status-counts">
      <div class="status-badge status-scheduled">예정: <span id="count-scheduled">0</span></div>
      <div class="status-badge status-in-progress">진행: <span id="count-in-progress">0</span></div>
      <div class="status-badge status-review">검토: <span id="count-review">0</span></div>
      <div class="status-badge status-completed">완료: <span id="count-completed">0</span></div>
    </div>
  </div>

  <!-- 3. 업무 등록 및 목록 -->
  <div class="card">
    <h2>📋 업무 리스트</h2>
    <div class="input-group">
      <input type="text" id="task-input" placeholder="새로운 업무를 입력하세요..." onkeydown="if(event.key==='Enter') addTask()">
      <button class="add-btn" onclick="addTask()">추가</button>
    </div>

    <ul class="task-list" id="task-list"></ul>
  </div>
</div>

<script>
  const holidays2026 = [
    "2026-09-24", "2026-09-25", "2026-09-26",
    "2026-10-03", "2026-10-05",
    "2026-10-09"
  ];

  function calculateDday() {
    const today = new Date();
    today.setHours(0, 0, 0, 0);
    const targetDate = new Date("2026-11-20T00:00:00");

    if (today > targetDate) {
      document.getElementById('days-total').innerText = "종료";
      document.getElementById('days-work').innerText = "0일";
      document.getElementById('days-off').innerText = "0일";
      return;
    }

    const remainingDays = Math.round((targetDate - today) / (1000 * 60 * 60 * 24));

    let workDays = 0;
    let offDays = 0;

    let current = new Date(today);
    current.setDate(current.getDate() + 1);

    while (current <= targetDate) {
      const dayOfWeek = current.getDay();
      
      const year = current.getFullYear();
      const month = String(current.getMonth() + 1).padStart(2, '0');
      const day = String(current.getDate()).padStart(2, '0');
      const dateStr = `${year}-${month}-${day}`;

      const isWeekend = (dayOfWeek === 0 || dayOfWeek === 6);
      const isHoliday = holidays2026.includes(dateStr);

      if (isWeekend || isHoliday) {
        offDays++;
      } else {
        workDays++;
      }
      current.setDate(current.getDate() + 1);
    }

    document.getElementById('days-total').innerText = `${remainingDays}일`;
    document.getElementById('days-work').innerText = `${workDays}일`;
    document.getElementById('days-off').innerText = `${offDays}일`;
  }

  // 데이터 관리
  let tasks = JSON.parse(localStorage.getItem('myTasks')) || [];

  const priorityOrder = ['보통', '높음', '낮음'];
  const statusOrder = ['예정', '진행', '검토', '완료'];

  function saveTasks() {
    localStorage.setItem('myTasks', JSON.stringify(tasks));
    render();
  }

  function addTask() {
    const input = document.getElementById('task-input');
    const text = input.value.trim();
    if (!text) return;

    tasks.push({
      id: Date.now(),
      title: text,
      priority: '보통',
      status: '예정'
    });

    input.value = '';
    saveTasks();
  }

  function deleteTask(id) {
    tasks = tasks.filter(t => t.id !== id);
    saveTasks();
  }

  function togglePriority(id) {
    const task = tasks.find(t => t.id === id);
    if (!task) return;
    const nextIdx = (priorityOrder.indexOf(task.priority) + 1) % priorityOrder.length;
    task.priority = priorityOrder[nextIdx];
    saveTasks();
  }

  function toggleStatus(id) {
    const task = tasks.find(t => t.id === id);
    if (!task) return;
    const nextIdx = (statusOrder.indexOf(task.status) + 1) % statusOrder.length;
    task.status = statusOrder[nextIdx];
    saveTasks();
  }

  function render() {
    const listEl = document.getElementById('task-list');
    listEl.innerHTML = '';

    let statusCounts = { '예정': 0, '진행': 0, '검토': 0, '완료': 0 };

    tasks.forEach(task => {
      statusCounts[task.status]++;

      const li = document.createElement('li');
      li.className = 'task-item';
      li.draggable = true;
      li.dataset.id = task.id;

      let pClass = 'priority-medium';
      if (task.priority === '높음') pClass = 'priority-high';
      if (task.priority === '낮음') pClass = 'priority-low';

      let sClass = 'status-scheduled';
      if (task.status === '진행') sClass = 'status-in-progress';
      if (task.status === '검토') sClass = 'status-review';
      if (task.status === '완료') sClass = 'status-completed';

      li.innerHTML = `
        <span class="drag-handle">⋮⋮</span>
        <span class="task-title" style="${task.status === '완료' ? 'text-decoration: line-through; color: #94a3b8;' : ''}">
          ${escapeHtml(task.title)}
        </span>
        <button class="btn-toggle ${pClass}" onclick="togglePriority(${task.id})">
          우선순위: ${task.priority}
        </button>
        <button class="btn-toggle ${sClass}" onclick="toggleStatus(${task.id})">
          상태: ${task.status}
        </button>
        <button class="btn-delete" onclick="deleteTask(${task.id})">✕</button>
      `;

      listEl.appendChild(li);
    });

    // 드래그 앤 드롭 이벤트 등록
    addDragAndDropEvents();

    // 상태별 개수 업데이트
    document.getElementById('count-scheduled').innerText = statusCounts['예정'];
    document.getElementById('count-in-progress').innerText = statusCounts['진행'];
    document.getElementById('count-review').innerText = statusCounts['검토'];
    document.getElementById('count-completed').innerText = statusCounts['완료'];

    // 진행도 계산
    const total = tasks.length;
    const completed = statusCounts['완료'];
    const percent = total === 0 ? 0 : Math.round((completed / total) * 100);

    document.getElementById('progress-percent').innerText = `${percent}%`;
    document.getElementById('progress-fill').style.width = `${percent}%`;
  }

  // 드래그 앤 드롭 이벤트 처리
  function addDragAndDropEvents() {
    const list = document.getElementById('task-list');
    const items = list.querySelectorAll('.task-item');

    items.forEach(item => {
      item.addEventListener('dragstart', (e) => {
        // 버튼 클릭 중 드래그 방지
        if (e.target.tagName === 'BUTTON') {
          e.preventDefault();
          return;
        }
        item.classList.add('dragging');
      });

      item.addEventListener('dragend', () => {
        item.classList.remove('dragging');
        updateTasksOrder();
      });
    });

    list.addEventListener('dragover', (e) => {
      e.preventDefault();
      const draggingItem = document.querySelector('.dragging');
      if (!draggingItem) return;

      const siblings = [...list.querySelectorAll('.task-item:not(.dragging)')];
      const nextSibling = siblings.find(sibling => {
        return e.clientY <= sibling.getBoundingClientRect().top + sibling.offsetHeight / 2;
      });

      list.insertBefore(draggingItem, nextSibling);
    });
  }

  // 드래그 후 새로 변경된 순서 저장
  function updateTasksOrder() {
    const listItems = document.querySelectorAll('.task-item');
    const newTasks = [];

    listItems.forEach(item => {
      const id = Number(item.dataset.id);
      const foundTask = tasks.find(t => t.id === id);
      if (foundTask) {
        newTasks.push(foundTask);
      }
    });

    tasks = newTasks;
    localStorage.setItem('myTasks', JSON.stringify(tasks));
  }

  function escapeHtml(text) {
    return text.replace(/[&<>"']/g, function(m) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
    });
  }

  calculateDday();
  render();
</script>
</body>
</html>
